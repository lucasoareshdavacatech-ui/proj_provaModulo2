<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Gestão Financeira</h1>
        
        <!-- Dashboard de Resumo (Atividade 3) -->
        <div class="dashboard">
            <div class="balance-box income-box">
                <small>Entradas</small>
                <p id="total-income">R$ 0.00</p>
            </div>
            <div class="balance-box expense-box">
                <small>Saídas</small>
                <p id="total-expenses">R$ 0.00</p>
            </div>
            <div class="balance-box total-box">
                <small>Saldo Atual</small>
                <p id="total-balance">R$ 0.00</p>
            </div>
        </div>

        <!-- Formulário de Transação -->
        <form id="finance-form">
            <input type="text" id="desc-input" placeholder="Descrição (ex: Salário, Aluguel)" required>
            <input type="number" id="value-input" placeholder="Valor (positivo para receita, negativo para gasto)" required>
            <button type="submit">Adicionar Transação</button>
        </form>

        <!-- Lista de Transações -->
        <h2>Histórico de Transações</h2>
        <ul id="transactions-list"></ul>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
